<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Recommend a Provider | NeighborSource</title>
  <meta name="description" content="NeighborSource local services directory">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main><section class="page-hero"><div class="container"><h1>Recommend a Provider</h1><p>Help your neighbors by sharing your experience.</p></div></section>
<section class="section"><div class="container"><form class="card form-card" data-demo-form>
  <div class="form-grid">
    <div class="field full"><label>Which provider did you use?</label><input required placeholder="Provider name"></div>
    <div class="field full"><label>Would you recommend them?</label><select required><option>Yes, I recommend them</option><option>No, I do not recommend them</option></select></div>
    <div class="field full"><label>What service did they provide?</label><input required placeholder="Deck repair, dog walking, notary..."></div>
    <div class="field"><label>Would you use them again?</label><select><option>Yes</option><option>No</option></select></div>
    <div class="field"><label>Your Community / City</label><input placeholder="Chesapeake"></div>
    <div class="field full"><label>Tell your neighbors about your experience (optional)</label><textarea></textarea></div>
    <div class="field"><label>Your Name</label><input required></div>
    <div class="field"><label>Your Email</label><input required type="email"></div>
  </div>
  <button class="btn btn-primary" type="submit">Submit Recommendation</button><div class="notice green success-message"><strong>Prototype:</strong> Your form is working on the page. When we connect this site to Google Forms/Sheets, this submission will go to your real admin workflow.</div>
</form></div></section></main>

<script src="js/app.js"></script>
</body>
</html>
