<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Post What You Need | NeighborSource</title>
  <meta name="description" content="NeighborSource local services directory">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main><section class="page-hero"><div class="container"><h1>Post What You Need</h1><p>Tell local providers what you are looking for.</p></div></section>
<section class="section"><div class="container"><form class="card form-card" data-demo-form>
  <div class="form-grid">
    <div class="field full"><label>What do you need help with?</label><textarea required placeholder="Example: I need someone to replace one specialty window."></textarea></div>
    <div class="field"><label>Category</label><select required><option>Home & Repair</option><option>Lawn & Outdoor</option><option>Cleaning</option><option>Pets</option><option>Automotive</option><option>Child Care</option><option>Other Services</option></select></div>
    <div class="field"><label>Location</label><input required placeholder="Western Branch, Chesapeake"></div>
    <div class="field"><label>When do you need it?</label><select><option>As soon as possible</option><option>Within a week</option><option>Within a month</option><option>I'm flexible</option></select></div>
    <div class="field"><label>Preferred Contact</label><select><option>Text</option><option>Phone</option><option>Email</option></select></div>
    <div class="field"><label>Your Name</label><input required></div>
    <div class="field"><label>Email or Phone</label><input required></div>
    <div class="field full"><label>Photo Link (optional)</label><input type="url" placeholder="Optional link to photos"></div>
  </div>
  <button class="btn btn-green" type="submit">Submit Request</button><div class="notice green success-message"><strong>Prototype:</strong> Your form is working on the page. When we connect this site to Google Forms/Sheets, this submission will go to your real admin workflow.</div>
</form></div></section></main>

<script src="js/app.js"></script>
</body>
</html>
