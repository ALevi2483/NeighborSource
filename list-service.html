<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>List Your Service | NeighborSource</title>
  <meta name="description" content="NeighborSource local services directory">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main><section class="page-hero"><div class="container"><h1>List Your Service</h1><p>Share your business or individual service with the community.</p></div></section>
<section class="section"><div class="container"><form class="card form-card" data-demo-form>
  <div class="form-grid">
    <div class="field full"><label>Listing Type</label><select required><option>Business</option><option>Individual Service Provider</option></select></div>
    <div class="field"><label>Business / Service Name</label><input required placeholder="KDH Construction, LLC"></div>
    <div class="field"><label>Contact Name</label><input required placeholder="Your name"></div>
    <div class="field"><label>Phone</label><input required type="tel" placeholder="757-555-0100"></div>
    <div class="field"><label>Email</label><input required type="email" placeholder="you@example.com"></div>
    <div class="field"><label>Category</label><select required><option value="">Choose a category</option><option>Home & Repair</option><option>Lawn & Outdoor</option><option>Cleaning</option><option>Pets</option><option>Automotive</option><option>Child Care</option><option>Tutoring & Lessons</option><option>Events & Photography</option><option>Moving & Hauling</option><option>Technology</option><option>Notary & Professional</option><option>Other Services</option></select></div>
    <div class="field"><label>Service Area</label><input required placeholder="Chesapeake, Suffolk"></div>
    <div class="field full"><label>What services do you provide?</label><input required placeholder="Decks, fences, repairs"></div>
    <div class="field full"><label>Description</label><textarea required placeholder="Tell neighbors what you do."></textarea></div>
    <div class="field"><label>Website</label><input type="url" placeholder="https://"></div>
    <div class="field"><label>Facebook Page</label><input type="url" placeholder="https://facebook.com/..."></div>
    <div class="field full"><label><input type="checkbox" style="width:auto"> I confirm this information is accurate and I am authorized to submit it.</label></div>
  </div>
  <button class="btn btn-green" type="submit">Submit Listing</button>
  <div class="notice green success-message"><strong>Prototype:</strong> Your form is working on the page. When we connect this site to Google Forms/Sheets, this submission will go to your real admin workflow.</div>
</form></div></section></main>

<script src="js/app.js"></script>
</body>
</html>
