<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Suggest a Provider | NeighborSource</title>
  <meta name="description" content="NeighborSource local services directory">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main><section class="page-hero"><div class="container"><h1>Suggest a Provider</h1><p>Know a great local business or individual? Help the community find them.</p></div></section>
<section class="section"><div class="container"><form class="card form-card" data-demo-form>
  <div class="form-grid">
    <div class="field full"><label>Provider Name</label><input required placeholder="Business or person's name"></div>
    <div class="field"><label>What do they do?</label><input required placeholder="Plumbing, tutoring, lawn care..."></div>
    <div class="field"><label>Category</label><select required><option>Home & Repair</option><option>Lawn & Outdoor</option><option>Cleaning</option><option>Pets</option><option>Automotive</option><option>Child Care</option><option>Notary & Professional</option><option>Other Services</option></select></div>
    <div class="field full"><label>Why do you recommend them?</label><textarea required></textarea></div>
    <div class="field"><label>Your Name</label><input required></div>
    <div class="field"><label>Your Email</label><input required type="email"></div>
  </div>
  <button class="btn btn-primary" type="submit">Submit Suggestion</button><div class="notice green success-message"><strong>Prototype:</strong> Your form is working on the page. When we connect this site to Google Forms/Sheets, this submission will go to your real admin workflow.</div>
</form></div></section></main>

<script src="js/app.js"></script>
</body>
</html>
