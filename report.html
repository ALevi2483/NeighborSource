<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Report a Listing | NeighborSource</title>
  <meta name="description" content="NeighborSource local services directory">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main><section class="page-hero"><div class="container"><h1>Report a Listing</h1><p>Help us keep NeighborSource accurate and useful.</p></div></section>
<section class="section"><div class="container"><form class="card form-card" data-demo-form>
  <div class="form-grid">
    <div class="field full"><label>Which listing are you reporting?</label><input required></div>
    <div class="field full"><label>Reason for report</label><select required><option>Incorrect information</option><option>Business closed</option><option>Possible scam</option><option>Inappropriate listing</option><option>False credential claim</option><option>Other</option></select></div>
    <div class="field full"><label>Additional details</label><textarea></textarea></div>
    <div class="field"><label>Your Name</label><input required></div>
    <div class="field"><label>Your Email</label><input required type="email"></div>
  </div>
  <button class="btn btn-primary" type="submit">Submit Report</button><div class="notice green success-message"><strong>Prototype:</strong> Your form is working on the page. When we connect this site to Google Forms/Sheets, this submission will go to your real admin workflow.</div>
</form></div></section></main>

<script src="js/app.js"></script>
</body>
</html>
