<!doctype html>

<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Contact | NeighborSource
  </title>

  <meta
    name="description"
    content="Contact NeighborSource with questions, feedback, or website issues."
  >

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>


<body>


<main>


  <!-- PAGE HEADER -->

  <section class="page-hero">

    <div class="container">

      <h1>
        Contact NeighborSource
      </h1>

      <p>
        Have a question, suggestion, or problem with the website? Send us a message.
      </p>

    </div>

  </section>



  <!-- CONTACT FORM -->

  <section class="section">

    <div class="container">


      <form
        class="card form-card"
        id="contactForm"
        action="https://script.google.com/macros/s/AKfycbx4bTHYgVwb9rB66m4hnFKvxtPHrTwe6qoqdERU_eRVb4yg1cdrH1zkeIHHl54573_8/exec"
        method="POST"
        target="contactFrame"
      >


        <!-- DATABASE TYPE -->

        <input
          type="hidden"
          name="type"
          value="contact"
        >



        <div class="form-grid">


          <!-- NAME -->

          <div class="field">

            <label for="name">
              Your Name
            </label>

            <input
              id="name"
              name="name"
              type="text"
              required
              placeholder="Your name"
            >

          </div>



          <!-- EMAIL -->

          <div class="field">

            <label for="email">
              Your Email
            </label>

            <input
              id="email"
              name="email"
              type="email"
              required
              placeholder="you@example.com"
            >

          </div>



          <!-- SUBJECT -->

          <div class="field full">

            <label for="subject">
              Subject
            </label>

            <select
              id="subject"
              name="subject"
              required
            >

              <option value="">
                Choose a subject
              </option>

              <option value="General Question">
                General Question
              </option>

              <option value="Website Problem">
                Website Problem
              </option>

              <option value="Listing Question">
                Listing Question
              </option>

              <option value="Verification Question">
                Verification Question
              </option>

              <option value="Suggestion">
                Suggestion
              </option>

              <option value="Privacy Question">
                Privacy Question
              </option>

              <option value="Other">
                Other
              </option>

            </select>

          </div>



          <!-- MESSAGE -->

          <div class="field full">

            <label for="message">
              Message
            </label>

            <textarea
              id="message"
              name="message"
              required
              placeholder="Tell us how we can help."
            ></textarea>

          </div>



          <!-- CONFIRMATION -->

          <div class="field full">

            <label class="check-row">

              <input
                type="checkbox"
                id="contactConfirmation"
                required
              >

              I confirm that the information I submitted is accurate.

            </label>

          </div>


        </div>



        <!-- SUBMIT -->

        <button
          class="btn btn-green"
          type="submit"
          id="submitContactButton"
        >

          Send Message

        </button>



        <!-- SUBMITTING -->

        <div
          class="notice"
          id="submittingMessage"
          style="
            display:none;
            margin-top:16px;
          "
        >

          <strong>
            Sending your message...
          </strong>

          Please do not close this page.

        </div>



        <!-- SUCCESS -->

        <div
          class="notice green"
          id="successMessage"
          style="
            display:none;
            margin-top:16px;
          "
        >

          <strong>
            Message sent.
          </strong>

          Thank you for contacting NeighborSource.

        </div>



        <!-- ERROR -->

        <div
          class="notice warning"
          id="errorMessage"
          style="
            display:none;
            margin-top:16px;
          "
        >

          <strong>
            We could not send your message.
          </strong>

          Please check your information and try again.

        </div>


      </form>


    </div>

  </section>


</main>



<!-- HIDDEN GOOGLE APPS SCRIPT TARGET -->

<iframe
  name="contactFrame"
  id="contactFrame"
  style="
    width:0;
    height:0;
    border:0;
    position:absolute;
    left:-9999px;
  "
></iframe>



<!-- MAIN NEIGHBORSOURCE JAVASCRIPT -->

<script src="js/app.js"></script>



<!-- CONTACT FORM JAVASCRIPT -->

<script>

document.addEventListener(
  "DOMContentLoaded",
  function () {


    /**********************************************
     * ELEMENTS
     **********************************************/

    const form =
      document.getElementById(
        "contactForm"
      );


    const submitButton =
      document.getElementById(
        "submitContactButton"
      );


    const submittingMessage =
      document.getElementById(
        "submittingMessage"
      );


    const successMessage =
      document.getElementById(
        "successMessage"
      );


    const errorMessage =
      document.getElementById(
        "errorMessage"
      );


    const iframe =
      document.getElementById(
        "contactFrame"
      );


    let submissionStarted =
      false;



    /**********************************************
     * FORM SUBMISSION
     **********************************************/

    form.addEventListener(
      "submit",
      function () {


        successMessage.style.display =
          "none";


        errorMessage.style.display =
          "none";


        submittingMessage.style.display =
          "block";


        submitButton.disabled =
          true;


        submitButton.textContent =
          "Sending...";


        submissionStarted =
          true;


        /*
         * Do not prevent default.
         *
         * The form posts directly to
         * Google Apps Script through the
         * hidden iframe.
         */

      }
    );



    /**********************************************
     * APPS SCRIPT FINISHED
     **********************************************/

    iframe.addEventListener(
      "load",
      function () {


        if (
          !submissionStarted
        ) {

          return;

        }


        submissionStarted =
          false;


        submittingMessage.style.display =
          "none";


        successMessage.style.display =
          "block";


        errorMessage.style.display =
          "none";


        submitButton.disabled =
          false;


        submitButton.textContent =
          "Send Message";


        /******************************************
         * RESET FORM
         ******************************************/

        form.reset();


        /******************************************
         * SCROLL TO SUCCESS
         ******************************************/

        successMessage.scrollIntoView({

          behavior:
            "smooth",

          block:
            "center"

        });


      }
    );


  }
);

</script>


</body>

</html>
