<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact | NeighborSource</title>
  <meta name="description" content="NeighborSource local services directory">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main><section class="page-hero"><div class="container"><h1>Contact Us</h1><p>Questions, feedback, or a problem with the site? Send a message.</p></div></section>
<section class="section"><div class="container"><form class="card form-card" data-demo-form>
  <div class="form-grid">
    <div class="field"><label>Name</label><input required></div>
    <div class="field"><label>Email</label><input required type="email"></div>
    <div class="field full"><label>Subject</label><input required></div>
    <div class="field full"><label>Message</label><textarea required></textarea></div>
  </div>
  <button class="btn btn-primary" type="submit">Send Message</button><div class="notice green success-message"><strong>Prototype:</strong> Your form is working on the page. When we connect this site to Google Forms/Sheets, this submission will go to your real admin workflow.</div>
</form></div></section></main>

<script src="js/app.js"></script>
</body>
</html>
