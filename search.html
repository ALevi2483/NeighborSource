<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Search Local Services | FindLocal757.com
  </title>
  <link rel="canonical" href="https://findlocal757.com/search.html">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://findlocal757.com/search.html">
  <meta property="og:title" content="Search Local Services | FindLocal757.com">
  <meta property="og:description" content="Search FindLocal757.com for local businesses and individual service providers across Hampton Roads.">

  <meta
    name="description"
    content="Search FindLocal757.com for local businesses and individual service providers across Hampton Roads."
  >

  <link
    rel="stylesheet"
    href="css/style.css?v=6"
  >


  <style>

    /* =========================================
       SEARCH PAGE
       ========================================= */

    .search-page-hero {
      text-align: center;
      padding-top: 54px;
      padding-bottom: 54px;
    }

    .search-page-hero .container {
      max-width: 900px;
    }

    .search-page-hero p {
      max-width: 680px;
      margin-left: auto;
      margin-right: auto;
    }


    /* =========================================
       SEARCH FORM
       ========================================= */

    .search-main-section {
      padding-top: 42px;
    }



    /* =========================================
       RESULTS HEADING
       ========================================= */

    .search-results-heading {
      margin-bottom: 24px;
    }

    .search-results-heading h2 {
      overflow-wrap: anywhere;
    }

    #search-query {
      color: var(--blue);
    }


    /* =========================================
       RESULTS
       ========================================= */

    #search-results {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      align-items: stretch;
    }

    #search-results .provider-card {
      height: 100%;
    }

    #search-results .provider-actions {
      margin-top: auto;
    }


    /* =========================================
       TABLET
       ========================================= */

    @media (max-width: 900px) {

      .search-page-hero {
        padding-top: 48px;
        padding-bottom: 48px;
      }

      #search-results {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

    }


    /* =========================================
       MOBILE
       ========================================= */

    @media (max-width: 650px) {

      .search-page-hero {
        text-align: left;
        padding-block: 24px;
      }

      .search-page-hero h1 {
        font-size: 32px;
        line-height: 1.08;
      }

      .search-page-hero p {
        font-size: 16px;
        line-height: 1.55;
      }


      /* SEARCH */

      .search-main-section {
        padding-top: 28px;
      }


      /* RESULTS HEADER */

      .search-results-heading {
        align-items: flex-start;
        gap: 18px;
      }

      .search-results-heading .btn {
        width: 100%;
      }


      /* RESULTS */

      #search-results {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      #search-results .provider-card {
        width: 100%;
      }

      #search-results .provider-actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      #search-results .provider-actions .btn {
        width: 100%;
      }


    }

  </style>

</head>


<body>


<main id="main-content" tabindex="-1">


  <!-- =========================================
       PAGE HERO
       ========================================= -->

  <section class="page-hero search-page-hero">

    <div class="container">


      <h1>
        Search Local Services
      </h1>


      <p>
        Find businesses and independent providers across Hampton Roads.
      </p>


    </div>

  </section>



  <!-- =========================================
       SEARCH + RESULTS
       ========================================= -->

  <section class="section search-main-section">

    <div class="container">


      <!-- SEARCH BAR -->

      <form class="directory-search" action="search.html" method="get" role="search">
        <label for="search-page-input">
          Service or provider
          <input id="search-page-input" type="search" name="q" placeholder="Try lawn care or a business name">
        </label>
        <label for="search-city">
          City or area
          <select id="search-city" name="city"><option value="">All areas</option></select>
        </label>
        <label for="search-category">
          Category
          <select id="search-category" name="category"><option value="">All categories</option></select>
        </label>
        <div class="directory-search-actions">
          <button class="btn btn-green" type="submit">Search</button>
          <a class="btn btn-outline" href="search.html">Clear filters</a>
        </div>
      </form>

      <!-- SEARCH HEADING -->

      <div class="section-heading-row search-results-heading">


        <div>


          <h2>
            Results for
            <span id="search-query">
              all services
            </span>
          </h2>


          <p
            class="section-intro"
            id="result-count" role="status"
          >
            Searching...
          </p>


        </div>



        <a
          class="btn btn-outline"
          href="services.html"
        >
          Browse Categories
        </a>


      </div>



      <!-- RESULTS -->

      <div
        class="search-results"
        id="search-results"
      >

        <div class="card empty-state">

          <p>
            Loading local providers...
          </p>

        </div>

      </div>


      <button class="btn btn-outline" id="search-more" type="button" hidden>Show more providers</button>
    </div>

  </section>



</main>



<script src="js/app.js?v=6"></script>


</body>

</html>
