<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Update or Remove a Listing | NeighborSource</title>
  <meta name="description" content="NeighborSource local services directory">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main><section class="page-hero"><div class="container"><h1>Update or Remove a Listing</h1><p>Request a change to an existing NeighborSource listing.</p></div></section>
<section class="section"><div class="container"><form class="card form-card" data-demo-form>
  <div class="form-grid">
    <div class="field"><label>Your Email</label><input required type="email"></div>
    <div class="field"><label>Business / Service Name</label><input required></div>
    <div class="field full"><label>What would you like to do?</label><select><option>Update information</option><option>Remove my listing</option></select></div>
    <div class="field full"><label>What needs to be changed?</label><textarea required></textarea></div>
  </div>
  <button class="btn btn-primary" type="submit">Submit Request</button><div class="notice green success-message"><strong>Prototype:</strong> Your form is working on the page. When we connect this site to Google Forms/Sheets, this submission will go to your real admin workflow.</div>
</form></div></section></main>

<script src="js/app.js"></script>
</body>
</html>
